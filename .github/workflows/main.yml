name: Build NineCrowns

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-disabled: true

      - name: Find project
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 4 -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build
        run: gradle -p "$PROJECT_DIR" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NineCrowns-26.1-v1.2.1
          path: |
            **/build/libs/*.jar
            !**/build/libs/*sources*.jar
